name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Regal.slnx
      - name: Build
        run: dotnet build Regal.slnx --no-restore --configuration Release
      - name: Install the browser for end-to-end tests
        run: pwsh tests/Regal.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Test
        # Integration tests start PostgreSQL through the Docker engine on the runner.
        run: dotnet test Regal.slnx --no-build --configuration Release --verbosity normal
