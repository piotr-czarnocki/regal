services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: regal
      POSTGRES_USER: regal_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REGAL_APP_PASSWORD: ${REGAL_APP_PASSWORD:?Set REGAL_APP_PASSWORD in .env}
    ports:
      # Reachable only from this computer, never from the local network.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep their data under a versioned subfolder of this path.
      - regal-db:/var/lib/postgresql
      # Runs only the first time, when the volume is still empty.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regal_owner -d regal"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  regal-db:
